map "$request_method:$uri" $auth_rate_key {
    default "";
    ~^POST:/api/v1/auth/(login|register|refresh)$ $binary_remote_addr;
}
map $uri $static_cache {
    default "no-cache";
    ~^/_next/static/ "public, max-age=31536000, immutable";
}
limit_req_zone $auth_rate_key zone=auth:10m rate=30r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Next.js generates a fresh nonce CSP for each HTML response.
    add_header Cache-Control $static_cache always;
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;

    # 覆盖而非追加客户端转发头；API 只应信任此受控网关。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ { proxy_pass http://api:8000; }
    location /health/ { proxy_pass http://api:8000; }
    location /internal/ { return 404; }
    location /file-transfers/ {
        # Tickets are bearer capabilities. Never write them to access logs.
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 32m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass http://file-gateway:8081;
    }
    location / {
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://frontend:3000;
    }
}
