map "$request_method:$uri" $auth_rate_key {
    default "";
    ~^POST:/api/v1/auth/(login|register|refresh)$ $binary_remote_addr;
}
map $uri $static_cache {
    default "";
    /index.html "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}
limit_req_zone $auth_rate_key zone=auth:10m rate=30r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Cache-Control $static_cache always;
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;

    # 覆盖而非追加客户端转发头；API 只应信任此受控网关。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ { proxy_pass http://api:8000; }
    location /health/ { proxy_pass http://api:8000; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
