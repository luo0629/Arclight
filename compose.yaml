x-app: &app
  build:
    context: ./backend
  environment: &app-env
    ARCLIGHT_ENVIRONMENT: development
    ARCLIGHT_DATABASE_URL: postgresql+psycopg://arclight:arclight@postgres:5432/arclight
    ARCLIGHT_CHECKPOINT_URL: postgresql://arclight:arclight@postgres:5432/arclight
    ARCLIGHT_REDIS_URL: redis://redis:6379/0
    ARCLIGHT_API_TOKEN: ${ARCLIGHT_API_TOKEN:-local-development-token-change-me}
    ARCLIGHT_JWT_SECRET: ${ARCLIGHT_JWT_SECRET:-arclight-local-jwt-secret-change-before-deploying}
    ARCLIGHT_ALLOW_REGISTRATION: ${ARCLIGHT_ALLOW_REGISTRATION:-true}
    ARCLIGHT_AUTH_ALLOWED_ORIGINS: ${ARCLIGHT_AUTH_ALLOWED_ORIGINS:-[]}
    ARCLIGHT_OBJECT_STORAGE_BACKEND: s3
    ARCLIGHT_S3_ENDPOINT_URL: http://minio:9000
    ARCLIGHT_FILE_GATEWAY_SECRET: ${ARCLIGHT_FILE_GATEWAY_SECRET:-local-file-gateway-change-before-deploying}
    ARCLIGHT_FILE_TRANSFER_BASE_URL: /file-transfers
    ARCLIGHT_S3_BUCKET: ${ARCLIGHT_S3_BUCKET:-arclight-media}
    ARCLIGHT_S3_ACCESS_KEY: ${ARCLIGHT_S3_ACCESS_KEY:-arclight-local}
    ARCLIGHT_S3_SECRET_KEY: ${ARCLIGHT_S3_SECRET_KEY:-arclight-local-storage-change-me}
    ARCLIGHT_PROVIDER: ${ARCLIGHT_PROVIDER:-mock}
    ARCLIGHT_TEXT_DURATION_TOLERANCE_PERCENT: ${ARCLIGHT_TEXT_DURATION_TOLERANCE_PERCENT:-10}
    ARCLIGHT_MEDIA_LEASE_SECONDS: ${ARCLIGHT_MEDIA_LEASE_SECONDS:-60}
    ARCLIGHT_MEDIA_HEARTBEAT_SECONDS: ${ARCLIGHT_MEDIA_HEARTBEAT_SECONDS:-10}
    ARCLIGHT_MEDIA_POLL_SECONDS: ${ARCLIGHT_MEDIA_POLL_SECONDS:-30}
    ARCLIGHT_MEDIA_EXECUTION_POLICY: '${ARCLIGHT_MEDIA_EXECUTION_POLICY:-{}}'
    ARCLIGHT_LLM_API_KEY: ${ARCLIGHT_LLM_API_KEY:-}
    ARCLIGHT_LLM_BASE_URL: ${ARCLIGHT_LLM_BASE_URL:-https://api.openai.com/v1}
    ARCLIGHT_LLM_MODEL: ${ARCLIGHT_LLM_MODEL:-gpt-4.1-mini}
    ARCLIGHT_SERVICE_ENCRYPTION_KEY: ${ARCLIGHT_SERVICE_ENCRYPTION_KEY:-}
    ARCLIGHT_MODEL_SERVICE_ALLOWED_HOSTS: ${ARCLIGHT_MODEL_SERVICE_ALLOWED_HOSTS:-["api.openai.com"]}
  restart: unless-stopped

services:
  minio:
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${ARCLIGHT_S3_ACCESS_KEY:-arclight-local}
      MINIO_ROOT_PASSWORD: ${ARCLIGHT_S3_SECRET_KEY:-arclight-local-storage-change-me}
    volumes: ["media-objects:/data"]
    restart: unless-stopped

  storage-init:
    <<: *app
    restart: "no"
    command: ["/app/.venv/bin/python", "-m", "arclight.storage.objects"]
    depends_on:
      minio: {condition: service_healthy}

  web:
    build:
      context: ./fronted
      target: gateway
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
      file-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  file-gateway:
    build: ./backend
    command: ["/app/.venv/bin/uvicorn", "arclight.file_gateway:create_gateway", "--factory", "--host", "0.0.0.0", "--port", "8081", "--no-access-log"]
    environment:
      ARCLIGHT_ENVIRONMENT: development
      ARCLIGHT_FILE_GATEWAY_SECRET: ${ARCLIGHT_FILE_GATEWAY_SECRET:-local-file-gateway-change-before-deploying}
      ARCLIGHT_FILE_GATEWAY_API_URL: http://api:8000
      ARCLIGHT_S3_ENDPOINT_URL: http://minio:9000
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./fronted
      target: runner
    environment:
      ARCLIGHT_API_PROXY: http://api:8000
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arclight
      POSTGRES_PASSWORD: arclight
      POSTGRES_DB: arclight
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arclight -d arclight"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["/bin/sh", "-c", ".venv/bin/alembic upgrade head && .venv/bin/python -m arclight.workflows.checkpoints"]
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}

  api:
    <<: *app
    environment:
      <<: *app-env
      # 本地网关覆盖转发头，API 宿主端口仅监听 loopback；公网部署须限制可信代理。
      FORWARDED_ALLOW_IPS: ${ARCLIGHT_TRUSTED_PROXY_IPS:-*}
      ARCLIGHT_ASSET_STORAGE_PATH: /app/asset-objects
    volumes: ["asset-objects:/app/asset-objects"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["/app/.venv/bin/celery", "-A", "arclight.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  beat:
    <<: *app
    command: ["/app/.venv/bin/celery", "-A", "arclight.workers.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  asset-objects:
  media-objects:
