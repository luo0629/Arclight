[project]
name = "arclight"
version = "0.1.0"
description = "Reliable multi-agent visual storytelling production backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.156,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "celery[redis]>=5.5,<6",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/arclight"]

[tool.fastapi]
entrypoint = "arclight.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["apps/api/src/arclight"]
check_untyped_defs = true
ignore_missing_imports = true
