name: Arclight CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full regression checkpoint (module completion or delivery)
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Select verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      backend: ${{ steps.plan.outputs.backend }}
      web: ${{ steps.plan.outputs.web }}
      backend_tests: ${{ steps.plan.outputs.backend_tests }}
      web_tests: ${{ steps.plan.outputs.web_tests }}
      backend_matrix: ${{ steps.plan.outputs.backend_matrix }}
      web_matrix: ${{ steps.plan.outputs.web_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        name: Select changed tests or full checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCLIGHT_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || startsWith(github.ref, 'refs/tags/') }}
        run: python backend/scripts/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-scope
          path: backend/test-results/ci-scope.json
          if-no-files-found: error
          retention-days: 7

  check:
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.backend == 'true'
    name: check (${{ matrix.database }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.backend_matrix) }}
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arclight
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: arclight_test
        ports: ["5432:5432"]
        options: >-
          --shm-size=512m
          --health-cmd "pg_isready -U arclight -d arclight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.9.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          save-cache: ${{ matrix.database == 'sqlite' && matrix.shard == 1 }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: backend/pi_runtime/package-lock.json
      - run: uv sync --frozen
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/pi_runtime
      - run: npm test
        if: matrix.shard == 1 && (matrix.database == 'sqlite' || needs.scope.outputs.mode == 'fast')
        working-directory: backend/pi_runtime
      - run: uv run ruff check .
        if: matrix.shard == 1 && (matrix.database == 'sqlite' || needs.scope.outputs.mode == 'fast')
      - run: uv run ruff format --check .
        if: matrix.shard == 1 && (matrix.database == 'sqlite' || needs.scope.outputs.mode == 'fast')
      - run: uv run mypy
        if: matrix.shard == 1 && (matrix.database == 'sqlite' || needs.scope.outputs.mode == 'fast')
      - uses: docker/setup-buildx-action@v4
      - name: Build backend runtime image
        if: matrix.database == 'sqlite' && matrix.shard == 1 && needs.scope.outputs.mode == 'full'
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: arclight-backend:test
          load: true
          cache-from: type=gha,scope=arclight-backend
          cache-to: type=gha,scope=arclight-backend,mode=max,ignore-error=true
      - name: Verify packaged Pi runtime
        if: matrix.database == 'sqlite' && matrix.shard == 1 && needs.scope.outputs.mode == 'full'
        run: |
          start='{"type":"start","resume":"model","agent":{"name":"director","stage":"planning","instruction":"Check the runtime.","input":[{"role":"user","data":{}}]}}'
          reply=$(printf '%s\n' "$start" '{"type":"stop"}' | \
            docker run --rm -i --network none arclight-backend:test node /app/pi_runtime/runner.mjs)
          test "$reply" = "$(printf '%s\n' '{"type":"model"}' '{"type":"done"}')"
      - name: Build isolated S3 test service
        uses: docker/build-push-action@v7
        with:
          context: infra/minio
          tags: arclight-minio:test
          load: true
          cache-from: type=gha,scope=arclight-minio
          # Matrix jobs share restore cache; only one writes to avoid concurrent exports.
          cache-to: ${{ matrix.database == 'sqlite' && matrix.shard == 1 && 'type=gha,scope=arclight-minio,mode=max,ignore-error=true' || '' }}
      - name: Start isolated S3 test service
        run: |
          docker run -d --name arclight-test-minio -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=arclight-test -e MINIO_ROOT_PASSWORD=arclight-test-secret arclight-minio:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs arclight-test-minio
          exit 1
      - name: Ensure independent FFprobe media verification
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version
      - name: Database tests (${{ matrix.database }}, ${{ matrix.shard }}/${{ matrix.shards }})
        run: |
          # Partition whole files; the Redis broker tests must stay on one worker.
          if [[ "$CI_MODE" == full ]]; then
            mapfile -d '' -t test_files < <(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print0 | LC_ALL=C sort -z)
          else
            mapfile -t test_files < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["SELECTED_TESTS"])))')
          fi
          shard_files=()
          for ((index = SHARD - 1; index < ${#test_files[@]}; index += SHARDS)); do
            shard_files+=("${test_files[index]}")
          done
          if ((${#shard_files[@]} == 0)); then
            echo "::error::No test files selected for shard ${SHARD}/${SHARDS}"
            exit 1
          fi
          printf 'Selected %s test files for shard %s/%s\n' "${#shard_files[@]}" "$SHARD" "$SHARDS"
          uv run pytest -q -n auto --maxprocesses=4 --dist=loadfile --durations=20 --junitxml=test-results/pytest.xml "${shard_files[@]}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          CI_MODE: ${{ needs.scope.outputs.mode }}
          SELECTED_TESTS: ${{ needs.scope.outputs.backend_tests }}
          ARCLIGHT_TEST_S3_ENDPOINT: http://127.0.0.1:19000
          ARCLIGHT_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://arclight:ci-only-password@localhost:5432/arclight_test' || '' }}
          ARCLIGHT_TEST_REDIS_URL: redis://127.0.0.1:16379/15
      - name: Verify fast backend cases actually passed
        if: needs.scope.outputs.mode == 'fast'
        run: python scripts/ci_scope.py --verify-report backend --report test-results/pytest.xml
        env:
          ARCLIGHT_CI_SELECTED_TESTS: ${{ needs.scope.outputs.backend_tests }}
      - run: docker compose config --quiet
        if: matrix.shard == 1 && (matrix.database == 'sqlite' || needs.scope.outputs.mode == 'fast')
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-verification-${{ matrix.database }}-${{ matrix.shard }}
          path: backend/test-results/
          retention-days: 7

  web:
    needs: scope
    if: needs.scope.outputs.mode == 'full' || needs.scope.outputs.web == 'true'
    name: web (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.web_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.9.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          save-cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: |
            backend/pi_runtime/package-lock.json
            fronted/package-lock.json
      - run: uv sync --frozen --no-dev --directory backend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/pi_runtime
      - run: npm ci
        working-directory: fronted
      - run: npm run build
        working-directory: fronted
      - run: npx playwright install --with-deps chromium
        working-directory: fronted
      - name: Browser tests for selected scope
        run: |
          test_files=()
          if [[ "$CI_MODE" == fast ]]; then
            mapfile -t test_files < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["SELECTED_TESTS"])))')
            if ((${#test_files[@]} == 0)); then exit 1; fi
          fi
          npm run test:e2e -- --forbid-only --shard="$SHARD/$SHARDS" "${test_files[@]}"
        working-directory: fronted
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          CI_MODE: ${{ needs.scope.outputs.mode }}
          SELECTED_TESTS: ${{ needs.scope.outputs.web_tests }}
          ARCLIGHT_E2E_PRODUCTION: "1"
      - name: Verify fast browser cases actually passed
        if: needs.scope.outputs.mode == 'fast'
        working-directory: fronted
        run: python ../backend/scripts/ci_scope.py --verify-report web --report test-results/playwright-report.json
        env:
          ARCLIGHT_CI_SELECTED_TESTS: ${{ needs.scope.outputs.web_tests }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-verification-${{ matrix.shard }}
          path: fronted/test-results/
          retention-days: 7

  full_checkpoint:
    name: Full regression checkpoint
    if: ${{ always() && needs.scope.result == 'success' && needs.scope.outputs.mode == 'full' }}
    needs: [scope, check, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record only a successful complete regression
        env:
          BACKEND_RESULT: ${{ needs.check.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: test "$BACKEND_RESULT" = success && test "$WEB_RESULT" = success

  ci:
    name: Arclight CI passed
    if: ${{ always() }}
    needs: [scope, check, web, full_checkpoint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check selected by the scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          BACKEND_REQUIRED: ${{ needs.scope.outputs.backend }}
          WEB_REQUIRED: ${{ needs.scope.outputs.web }}
          BACKEND_RESULT: ${{ needs.check.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CHECKPOINT_RESULT: ${{ needs.full_checkpoint.result }}
        run: |
          test "$SCOPE_RESULT" = success || exit 1
          case "$MODE" in
            full)
              test "$BACKEND_RESULT" = success && test "$WEB_RESULT" = success && test "$CHECKPOINT_RESULT" = success
              ;;
            fast)
              test "$CHECKPOINT_RESULT" = skipped || exit 1
              if [[ "$BACKEND_REQUIRED" == true ]]; then test "$BACKEND_RESULT" = success || exit 1
              elif [[ "$BACKEND_REQUIRED" == false ]]; then test "$BACKEND_RESULT" = skipped || exit 1
              else exit 1; fi
              if [[ "$WEB_REQUIRED" == true ]]; then test "$WEB_RESULT" = success || exit 1
              elif [[ "$WEB_REQUIRED" == false ]]; then test "$WEB_RESULT" = skipped || exit 1
              else exit 1; fi
              ;;
            *) exit 1 ;;
          esac
