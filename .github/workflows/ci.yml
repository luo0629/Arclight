name: Arclight CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arclight
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: arclight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arclight -d arclight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: SQLite tests
        run: uv run pytest -q
      - name: PostgreSQL tests
        run: uv run pytest -q
        env:
          ARCLIGHT_TEST_DATABASE_URL: postgresql+psycopg://arclight:ci-only-password@localhost:5432/arclight_test
      - run: docker compose config --quiet
        working-directory: .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fronted/package-lock.json
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen --directory backend
      - run: npm ci
        working-directory: fronted
      - run: npm run build
        working-directory: fronted
      - run: npx playwright install --with-deps chromium
        working-directory: fronted
      - run: npm run test:e2e
        working-directory: fronted
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-verification
          path: fronted/test-results/
          retention-days: 7
