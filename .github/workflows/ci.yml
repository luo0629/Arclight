name: Arclight CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arclight
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: arclight_test
        ports: ["5432:5432"]
        options: >-
          --shm-size=512m
          --health-cmd "pg_isready -U arclight -d arclight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Build isolated S3 test service
        working-directory: .
        run: |
          docker build -t arclight-minio:test infra/minio
          docker run -d --name arclight-test-minio -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=arclight-test -e MINIO_ROOT_PASSWORD=arclight-test-secret arclight-minio:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs arclight-test-minio
          exit 1
      - name: SQLite tests
        run: uv run pytest -q
        env:
          ARCLIGHT_TEST_S3_ENDPOINT: http://127.0.0.1:19000
          ARCLIGHT_TEST_REDIS_URL: redis://127.0.0.1:16379/15
      - name: PostgreSQL tests
        run: uv run pytest -q
        env:
          ARCLIGHT_TEST_S3_ENDPOINT: http://127.0.0.1:19000
          ARCLIGHT_TEST_DATABASE_URL: postgresql+psycopg://arclight:ci-only-password@localhost:5432/arclight_test
          ARCLIGHT_TEST_REDIS_URL: redis://127.0.0.1:16379/15
      - run: docker compose config --quiet
        working-directory: .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fronted/package-lock.json
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen --directory backend
      - run: npm ci
        working-directory: fronted
      - run: npm run build
        working-directory: fronted
      - run: npx playwright install --with-deps chromium
        working-directory: fronted
      - run: npm run test:e2e
        working-directory: fronted
        env:
          ARCLIGHT_E2E_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-verification
          path: fronted/test-results/
          retention-days: 7
